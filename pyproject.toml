[project]
name = "kokoro-tts"
version = "0.1.0"
description = "Text-to-Speech script using MLX Audio and Kokoro model for Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "google-genai>=1.67.0",
    "httpx",
    "misaki[en]",
    "mcp==2.3.0",
    "mlx-audio",
    "mutagen>=1.47.0",
    "numpy",
    "pydub",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "soundfile",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
    "pytest-subtests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# curated-tokenizers (misaki[en] -> spacy-curated-transformers) ships only an sdist,
# and Cython 3.1+ crashes compiling it (OptimizeBuiltinCalls in _bbpe.pyx).
build-constraint-dependencies = ["cython<3.1"]
